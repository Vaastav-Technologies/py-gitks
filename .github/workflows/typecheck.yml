name: 💡 typecheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip

      - name: 💼 Install Type Check
        run: |
          python -m pip install --upgrade pip
          python -m pip install . --group typecheck

      - name: 🧠 Run Type Check
        run: |
          mypy -p gitks
